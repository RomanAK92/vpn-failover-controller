services:
  vpn-monitoring:
    build: .
    network_mode: host
    user: "65532:65532"
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
    command: [--telemetry, /telemetry/telemetry.json, --config, /private/kuma.json, --interval, "60"]
    volumes:
      - type: bind
        source: ${VPN_MONITORING_TELEMETRY:?Set the existing sanitized telemetry directory}
        target: /telemetry
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VPN_MONITORING_CONFIG:?Set the existing private Kuma configuration file}
        target: /private/kuma.json
        read_only: true
        bind: {create_host_path: false}
    logging: {driver: json-file, options: {max-size: 3m, max-file: "2"}}
