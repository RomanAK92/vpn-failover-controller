services:
  vpn-router:
    build: ./build
    image: vpn-failover-controller:local
    container_name: vpn-router
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,nosuid,size=16m
    volumes:
      - ./config/local:/etc/vpn:ro
      - /run/vpn-router:/run/vpn-router
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
